name: Dagster/dbt CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    # Expose GitHub Secrets as environment variables for Dagster/dbt to connect to Snowflake
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      # DAGSTER_HOME is needed for some dagster operations
      DAGSTER_HOME: ${{ github.workspace }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Dagster recommends 3.9 - 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          
      - name: Install Dependencies
        run: |
          uv sync --all-extras

      - name: Test dbt connectivity to Snowflake
        working-directory: ./analytics
        run: |
          uv run dbt debug

      - name: Parse and Compile dbt models
        working-directory: ./analytics
        run: |
          uv run dbt parse

      - name: Validate Dagster Definitions
        run: |
          uv run dg check defs

      # Optional: Uncomment the following lines if you want CI to actually execute your models
      # against Snowflake every time you push. Be aware this will modify your TAXI_DATA database.
      # - name: Run dbt build
      #   working-directory: ./analytics
      #   run: |
      #     uv run dbt build
