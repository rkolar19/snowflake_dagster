[project]
name = "dagster_snowflake_tutorial"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.2",
    "dagster-dbt>=0.29.2",
    "dagster-snowflake>=0.29.2",
    "dbt-snowflake>=1.11.4",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_snowflake_tutorial"
registry_modules = [
    "dagster_snowflake_tutorial.components.*",
]


